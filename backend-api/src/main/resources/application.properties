spring.application.name=backend-api
server.port=${PORT:8080}

# Base de datos H2 en memoria
spring.datasource.url=jdbc:h2:mem:tasksdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: crea y actualiza tablas automáticamente a partir de tus clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2 (para ver tus tablas en el navegador)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console